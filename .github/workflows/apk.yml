name: Build Awakening Gym APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - name: Uebungsdatenbank laden (free-exercise-db)
        run: curl -L -o www/exercises.json https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/dist/exercises.json
      - run: npm install
      - run: npx cap add android && npx cap sync android
      - name: App-Name setzen
        run: sed -i 's#<string name="app_name">.*</string>#<string name="app_name">Awakening Gym</string>#; s#<string name="title_activity_main">.*</string>#<string name="title_activity_main">Awakening Gym</string>#' android/app/src/main/res/values/strings.xml
      - name: App-Icon erzeugen
        run: npx @capacitor/assets generate --android
      - name: Bluetooth-Berechtigungen
        run: |
          sed -i '0,/<manifest /s#<manifest #<manifest xmlns:tools="http://schemas.android.com/tools" #' android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" tools:targetApi="s"/></manifest>#' android/app/src/main/AndroidManifest.xml
      - name: Berechtigungen fuer Erinnerung
        run: sed -i 's#</manifest>#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/><uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/></manifest>#' android/app/src/main/AndroidManifest.xml
      - name: Feste Signatur (damit Updates ueber die alte App moeglich sind)
        run: mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore
      - name: Versionsnummer setzen
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \".*\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - run: mv android/app/build/outputs/apk/debug/app-debug.apk android/Awakening-Gym-${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: awakening-gym-apk-${{ github.run_number }}
          path: android/Awakening-Gym-${{ github.run_number }}.apk
