name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - name: Uebungsdatenbank laden (free-exercise-db)
        run: curl -L -o www/exercises.json https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/dist/exercises.json
      - run: npm install
      - run: npx cap add android && npx cap sync android
      - name: App-Icon erzeugen
        run: npx @capacitor/assets generate --android
      - name: Bluetooth-Berechtigungen
        run: |
          sed -i '0,/<manifest /s#<manifest #<manifest xmlns:tools="http://schemas.android.com/tools" #' android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" tools:targetApi="s"/></manifest>#' android/app/src/main/AndroidManifest.xml
      - name: Berechtigungen fuer Erinnerung
        run: sed -i 's#</manifest>#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/><uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/></manifest>#' android/app/src/main/AndroidManifest.xml
      - name: Feste Signatur (damit Updates ueber die alte App moeglich sind)
        run: mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: {name: arise-gym-apk, path: android/app/build/outputs/apk/debug/app-debug.apk}
