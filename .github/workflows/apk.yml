name: Build Awakening Gym APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - name: Uebungsdatenbank laden (free-exercise-db)
        run: curl -L -o www/exercises.json https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/dist/exercises.json
      - run: npm install
      - run: npx cap add android && npx cap sync android
      - name: App-Name setzen
        run: sed -i 's#<string name="app_name">.*</string>#<string name="app_name">Awakening Gym</string>#; s#<string name="title_activity_main">.*</string>#<string name="title_activity_main">Awakening Gym</string>#' android/app/src/main/res/values/strings.xml
      - name: Icon mit Leuchtrand aus assets/icon-only.png erzeugen
        run: |
          python3 -c "import PIL" 2>/dev/null || python3 -m pip install --break-system-packages pillow
          python3 - <<'EOF'
          from PIL import Image, ImageDraw, ImageFilter, ImageChops
          N = 1024
          C = N // 2
          R = 312
          art = Image.open("assets/icon-only.png").convert("RGB").resize((N, N), Image.LANCZOS)

          def disc(r, ss=4):
              m = Image.new("L", (N * ss, N * ss), 0)
              ImageDraw.Draw(m).ellipse([(C - r) * ss, (C - r) * ss, (C + r) * ss, (C + r) * ss], fill=255)
              return m.resize((N, N), Image.LANCZOS)

          grad_row = Image.new("RGB", (N, 1))
          for x in range(N):
              t = x / (N - 1)
              a, b = (47, 107, 255), (255, 45, 111)
              grad_row.putpixel((x, 0), tuple(int(a[i] + (b[i] - a[i]) * t) for i in range(3)))
          grad = grad_row.resize((N, N))

          can = Image.new("RGB", (N, N), (0, 0, 0))
          can.paste(art.resize((2 * (R - 8), 2 * (R - 8)), Image.LANCZOS), (C - (R - 8), C - (R - 8)))
          base = Image.composite(can, Image.new("RGB", (N, N), (0, 0, 0)), disc(R - 8))
          ring = ImageChops.subtract(disc(R + 6), disc(R - 6))
          glow = ring.filter(ImageFilter.GaussianBlur(16)).point(lambda v: min(255, int(v * 2.4)))
          base = Image.composite(grad, base, glow)
          base = Image.composite(grad, base, ring)
          base.save("assets/icon-only.png")
          base.convert("RGBA").save("assets/icon-foreground.png")
          Image.new("RGB", (N, N), (0, 0, 0)).save("assets/icon-background.png")
          print("Icon-Ebenen erzeugt")
          EOF
      - name: App-Icon erzeugen
        run: |
          npx @capacitor/assets generate --android
          ls -la android/app/src/main/res/mipmap-xxxhdpi/
      - name: Schrittzaehler-Plugin einbauen
        run: |
          cat > android/app/src/main/java/de/arise/gym/StepsPlugin.java <<'EOF2'
          package de.arise.gym;

          import android.Manifest;
          import android.content.Context;
          import android.hardware.Sensor;
          import android.hardware.SensorEvent;
          import android.hardware.SensorEventListener;
          import android.hardware.SensorManager;
          import android.os.Handler;
          import android.os.Looper;

          import com.getcapacitor.JSObject;
          import com.getcapacitor.PermissionState;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.annotation.Permission;
          import com.getcapacitor.annotation.PermissionCallback;

          @CapacitorPlugin(
              name = "Steps",
              permissions = { @Permission(strings = { Manifest.permission.ACTIVITY_RECOGNITION }, alias = "activity") }
          )
          public class StepsPlugin extends Plugin {

              @PluginMethod
              public void read(PluginCall call) {
                  if (getPermissionState("activity") != PermissionState.GRANTED) {
                      requestPermissionForAlias("activity", call, "permResult");
                      return;
                  }
                  doRead(call);
              }

              @PermissionCallback
              private void permResult(PluginCall call) {
                  if (getPermissionState("activity") == PermissionState.GRANTED) {
                      doRead(call);
                  } else {
                      call.reject("permission");
                  }
              }

              private void doRead(final PluginCall call) {
                  final SensorManager sm = (SensorManager) getContext().getSystemService(Context.SENSOR_SERVICE);
                  final Sensor sensor = sm == null ? null : sm.getDefaultSensor(Sensor.TYPE_STEP_COUNTER);
                  if (sensor == null) {
                      call.reject("nosensor");
                      return;
                  }
                  final boolean[] done = { false };
                  final SensorEventListener[] holder = new SensorEventListener[1];
                  holder[0] = new SensorEventListener() {
                      @Override
                      public void onSensorChanged(SensorEvent event) {
                          if (done[0]) return;
                          done[0] = true;
                          sm.unregisterListener(holder[0]);
                          JSObject result = new JSObject();
                          result.put("steps", (double) event.values[0]);
                          call.resolve(result);
                      }

                      @Override
                      public void onAccuracyChanged(Sensor s, int accuracy) {}
                  };
                  sm.registerListener(holder[0], sensor, SensorManager.SENSOR_DELAY_NORMAL);
                  new Handler(Looper.getMainLooper()).postDelayed(
                      new Runnable() {
                          @Override
                          public void run() {
                              if (done[0]) return;
                              done[0] = true;
                              sm.unregisterListener(holder[0]);
                              call.reject("timeout");
                          }
                      },
                      5000
                  );
              }
          }
          EOF2
          cat > android/app/src/main/java/de/arise/gym/MainActivity.java <<'EOF'
          package de.arise.gym;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(StepsPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          EOF
      - name: Bluetooth-Berechtigungen
        run: |
          sed -i '0,/<manifest /s#<manifest #<manifest xmlns:tools="http://schemas.android.com/tools" #' android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" tools:targetApi="s"/></manifest>#' android/app/src/main/AndroidManifest.xml
      - name: Berechtigungen fuer Erinnerung
        run: sed -i 's#</manifest>#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/><uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/><uses-permission android:name="android.permission.USE_EXACT_ALARM"/><uses-permission android:name="android.permission.ACTIVITY_RECOGNITION"/></manifest>#' android/app/src/main/AndroidManifest.xml
      - name: Feste Signatur (damit Updates ueber die alte App moeglich sind)
        run: mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore
      - name: Versionsnummer setzen
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \".*\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - run: mv android/app/build/outputs/apk/debug/app-debug.apk android/Awakening-Gym-${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: awakening-gym-apk-${{ github.run_number }}
          path: android/Awakening-Gym-${{ github.run_number }}.apk
